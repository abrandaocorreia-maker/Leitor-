<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Controle de Encomendas - Teste</title> <script src="https://unpkg.com/html5-qrcode"></script> <style> *{ box-sizing:border-box; } body{ margin:0; padding:15px; background:#f4f6f8; font-family:Arial,sans-serif; color:#222; } .container{ max-width:700px; margin:auto; } h1{ text-align:center; margin:5px 0 20px; font-size:24px; } .card{ background:#fff; border-radius:14px; padding:16px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,.08); } .menu{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } button{ width:100%; border:0; border-radius:10px; padding:14px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px; } .primary{ background:#1976d2; color:#fff; } .success{ background:#2e7d32; color:#fff; } .secondary{ background:#455a64; color:#fff; } .danger{ background:#c62828; color:#fff; } .warning{ background:#ef6c00; color:#fff; } input, select{ width:100%; padding:13px; border:1px solid #ccc; border-radius:9px; font-size:16px; margin-top:6px; } label{ display:block; margin-top:13px; font-weight:bold; font-size:14px; } .file-label{ display:block; width:100%; background:#1976d2; color:white; border-radius:10px; padding:15px; text-align:center; font-weight:bold; margin-top:10px; cursor:pointer; } input[type=file]{ display:none; } .preview{ width:100%; max-height:400px; object-fit:contain; border-radius:10px; margin-top:15px; display:none; background:#eee; } .status{ margin-top:12px; padding:12px; border-radius:9px; background:#eef3f7; line-height:1.5; font-size:14px; } .success-box{ background:#e8f5e9; border:1px solid #a5d6a7; color:#2e7d32; } .error-box{ background:#ffebee; border:1px solid #ef9a9a; color:#c62828; } .warning-box{ background:#fff8e1; border:1px solid #ffe082; color:#795548; } .hidden{ display:none!important; } .badge{ display:inline-block; padding:5px 10px; border-radius:20px; background:#e3f2fd; color:#1565c0; font-size:12px; font-weight:bold; margin-bottom:10px; } .result{ border:1px solid #ddd; border-radius:10px; padding:12px; margin-top:10px; background:#fafafa; } .result strong{ display:block; color:#666; font-size:12px; text-transform:uppercase; margin-bottom:5px; } .result span{ font-size:17px; word-break:break-word; } #reader{ width:100%; margin-top:15px; } .signature-box{ border:2px dashed #aaa; border-radius:10px; background:#fff; width:100%; height:220px; touch-action:none; } .signature-actions{ display:grid; grid-template-columns:1fr 1fr; gap:10px; } .signature-actions button{ margin-top:8px; } .small{ font-size:13px; color:#666; } .status-count{ text-align:center; font-size:14px; color:#555; margin-top:10px; } </style> </head> <body> <div class="container"> <h1>📦 Controle de Encomendas</h1> <!-- ===================================================== MENU ====================================================== --> <div id="menuCard" class="card"> <div class="menu"> <button class="primary" onclick="mostrarCadastro()" > 📦 CADASTRAR </button> <button class="success" onclick="mostrarBaixa()" > 🚚 DAR BAIXA </button> </div> <div id="contador" class="status-count" ></div> </div> <!-- ===================================================== CADASTRO ====================================================== --> <div id="cadastroCard" class="card hidden" > <span class="badge"> CADASTRAR ENCOMENDA </span> <label class="file-label" for="fotoCadastro" > 📷 TIRAR FOTO E LER CÓDIGO </label> <input type="file" id="fotoCadastro" accept="image/*" capture="environment" > <img id="previewCadastro" class="preview" > <div id="statusCadastro" class="status" > Tire uma foto da etiqueta. </div> <label> Código </label> <input id="cadCodigo" placeholder="Código será lido automaticamente" > <label> Nome do destinatário </label> <input id="cadNome" placeholder="Ex.: Alexandre Brandão" > <label> Apartamento / Unidade </label> <input id="cadApartamento" placeholder="Ex.: 101" > <label> Quantidade </label> <input id="cadQuantidade" type="number" min="1" value="1" > <label> Fornecedor </label> <input id="cadFornecedor" placeholder="Ex.: Mercado Livre" > <label> Remetente </label> <input id="cadRemetente" placeholder="Opcional" > <button class="success" onclick="registrarEncomenda()" > ✅ REGISTRAR ENCOMENDA </button> <button class="secondary" onclick="voltarMenu()" > ← VOLTAR </button> </div> <!-- ===================================================== BAIXA ====================================================== --> <div id="baixaCard" class="card hidden" > <span class="badge"> DAR BAIXA NA ENCOMENDA </span> <button class="primary" onclick="abrirLeitorBaixa()" > 📷 LER CÓDIGO DE BARRAS </button> <div id="reader" class="hidden" ></div> <div id="statusBaixa" class="status" > Leia o código da encomenda para localizar o cadastro. </div> <!-- RESULTADO DA BUSCA --> <div id="encomendaEncontrada" class="hidden" > <div class="result"> <strong>Código</strong> <span id="baixaCodigo"></span> </div> <div class="result"> <strong>Destinatário</strong> <span id="baixaNome"></span> </div> <div class="result"> <strong>Apartamento / Unidade</strong> <span id="baixaApartamento"></span> </div> <div class="result"> <strong>Quantidade</strong> <span id="baixaQuantidade"></span> </div> <div class="result"> <strong>Fornecedor</strong> <span id="baixaFornecedor"></span> </div> <!-- REMETENTE EDITÁVEL --> <label> Remetente </label> <input id="baixaRemetente" placeholder="Nome do remetente" > <div class="small"> Você pode corrigir o nome do remetente antes de confirmar a baixa. </div> <!-- ASSINATURA --> <label> Assinatura </label> <canvas id="assinatura" class="signature-box" ></canvas> <div class="signature-actions"> <button class="secondary" onclick="limparAssinatura()" > 🧹 LIMPAR </button> <button class="success" onclick="confirmarBaixa()" > ✅ CONFIRMAR BAIXA </button> </div> </div> <button class="secondary" onclick="voltarMenu()" > ← VOLTAR </button> </div> <script> /* ========================================================= VARIÁVEIS ========================================================= */ let scanner = null; let scannerRodando = false; let encomendaAtual = null; let assinaturaCanvas = document.getElementById("assinatura"); let assinaturaCtx = assinaturaCanvas.getContext("2d"); let assinando = false; /* ========================================================= STORAGE ========================================================= */ function obterEncomendas(){ try{ return JSON.parse( localStorage.getItem( "encomendas_teste" ) || "[]" ); }catch(e){ return []; } } function salvarEncomendas(lista){ localStorage.setItem( "encomendas_teste", JSON.stringify(lista) ); } /* ========================================================= MENU ========================================================= */ function mostrarCadastro(){ pararScanner(); document .getElementById("cadastroCard") .classList.remove("hidden"); document .getElementById("baixaCard") .classList.add("hidden"); } function mostrarBaixa(){ pararScanner(); document .getElementById("baixaCard") .classList.remove("hidden"); document .getElementById("cadastroCard") .classList.add("hidden"); } function voltarMenu(){ pararScanner(); document .getElementById("cadastroCard") .classList.add("hidden"); document .getElementById("baixaCard") .classList.add("hidden"); atualizarContador(); } /* ========================================================= FOTO DE CADASTRO ========================================================= */ document .getElementById("fotoCadastro") .addEventListener( "change", async function(){ const arquivo = this.files[0]; if(!arquivo){ return; } const preview = document.getElementById( "previewCadastro" ); preview.src = URL.createObjectURL( arquivo ); preview.style.display = "block"; const status = document.getElementById( "statusCadastro" ); status.innerHTML = "🔎 Procurando código de barras..."; const codigo = await lerCodigoDaImagem( arquivo ); if(codigo){ document .getElementById("cadCodigo") .value = codigo; status.innerHTML = '<div class="success-box" style="padding:10px;border-radius:8px;">' + "✅ Código identificado:<br><b>" + escaparHTML(codigo) + "</b>" + "</div>"; }else{ status.innerHTML = '<div class="warning-box" style="padding:10px;border-radius:8px;">' + "⚠️ Não consegui identificar o código automaticamente. " + "Você pode digitá-lo manualmente." + "</div>"; } } ); /* ========================================================= LEITURA DE CÓDIGO NA FOTO ========================================================= */ async function lerCodigoDaImagem( arquivo ){ /* * Primeiro BarcodeDetector. */ if( "BarcodeDetector" in window ){ try{ const formatos = await BarcodeDetector .getSupportedFormats(); const detector = new BarcodeDetector({ formats:formatos }); const bitmap = await createImageBitmap( arquivo ); const resultados = await detector.detect( bitmap ); bitmap.close(); if( resultados && resultados.length ){ return resultados[0].rawValue; } }catch(e){ console.log( "BarcodeDetector:", e ); } } /* * Segunda tentativa: * html5-qrcode. */ try{ const elemento = document.createElement( "div" ); elemento.id = "scanner-temporario"; elemento.style.display = "none"; document.body.appendChild( elemento ); const leitor = new Html5Qrcode( "scanner-temporario" ); const resultado = await leitor.scanFile( arquivo, false ); try{ await leitor.clear(); }catch(e){} elemento.remove(); return resultado; }catch(e){ console.log( "html5-qrcode:", e ); return ""; } } /* ========================================================= REGISTRAR ========================================================= */ function registrarEncomenda(){ const codigo = document .getElementById("cadCodigo") .value .trim(); const nome = document .getElementById("cadNome") .value .trim(); const apartamento = document .getElementById("cadApartamento") .value .trim(); const quantidade = document .getElementById("cadQuantidade") .value; const fornecedor = document .getElementById("cadFornecedor") .value .trim(); const remetente = document .getElementById("cadRemetente") .value .trim(); if(!codigo){ alert( "Informe ou leia o código da encomenda." ); return; } if(!nome){ alert( "Informe o nome do destinatário." ); return; } if(!apartamento){ alert( "Informe o apartamento ou unidade." ); return; } const lista = obterEncomendas(); /* * Não permite cadastrar duas vezes * o mesmo código. */ const existente = lista.find( function(item){ return item.codigo .toUpperCase() === codigo.toUpperCase(); } ); if(existente){ alert( "Este código já está cadastrado." ); return; } const nova = { id: Date.now(), codigo: codigo, nome: nome, apartamento: apartamento, quantidade: Number(quantidade) || 1, fornecedor: fornecedor || "Não informado", remetente: remetente || "Não informado", status: "PENDENTE", dataCadastro: new Date().toISOString(), dataBaixa: "", assinatura: "" }; lista.push( nova ); salvarEncomendas( lista ); alert( "✅ Encomenda registrada com sucesso!" ); limparCadastro(); atualizarContador(); } /* ========================================================= LIMPAR CADASTRO ========================================================= */ function limparCadastro(){ document .getElementById("fotoCadastro") .value = ""; document .getElementById("previewCadastro") .style.display = "none"; document .getElementById("cadCodigo") .value = ""; document .getElementById("cadNome") .value = ""; document .getElementById("cadApartamento") .value = ""; document .getElementById("cadQuantidade") .value = "1"; document .getElementById("cadFornecedor") .value = ""; document .getElementById("cadRemetente") .value = ""; document .getElementById("statusCadastro") .innerHTML = "Tire uma foto da etiqueta."; } /* ========================================================= ABRIR LEITOR PARA BAIXA ========================================================= */ async function abrirLeitorBaixa(){ const reader = document.getElementById( "reader" ); reader.classList.remove( "hidden" ); document .getElementById( "statusBaixa" ) .innerHTML = "📷 Aponte a câmera para o código de barras."; pararScanner(); scanner = new Html5Qrcode( "reader" ); try{ await scanner.start( { facingMode: "environment" }, { fps:10, qrbox:{ width:280, height:150 }, aspectRatio: 1.777 }, function(decodedText){ codigoLidoNaBaixa( decodedText ); }, function(errorMessage){ /* * Ignoramos erros normais * enquanto a câmera procura o código. */ } ); scannerRodando = true; }catch(e){ console.error(e); document .getElementById( "statusBaixa" ) .innerHTML = '<div class="error-box" style="padding:10px;border-radius:8px;">' + "❌ Não foi possível abrir a câmera.<br>" + "Verifique a permissão de câmera do navegador." + "</div>"; } } /* ========================================================= CÓDIGO LIDO NA BAIXA ========================================================= */ function codigoLidoNaBaixa( codigo ){ if(!codigo){ return; } pararScanner(); document .getElementById("reader") .classList.add("hidden"); const lista = obterEncomendas(); const encomenda = lista.find( function(item){ return ( item.codigo .trim() .toUpperCase() === codigo .trim() .toUpperCase() ); } ); if(!encomenda){ encomendaAtual = null; document .getElementById( "encomendaEncontrada" ) .classList.add( "hidden" ); document .getElementById( "statusBaixa" ) .innerHTML = '<div class="error-box" style="padding:10px;border-radius:8px;">' + "❌ <b>ENCOMENDA NÃO ENCONTRADA</b><br><br>" + "O código <b>" + escaparHTML(codigo) + "</b> não está cadastrado." + "</div>"; return; } /* * Não permite dar baixa novamente. */ if( encomenda.status === "ENTREGUE" ){ document .getElementById( "statusBaixa" ) .innerHTML = '<div class="warning-box" style="padding:10px;border-radius:8px;">' + "⚠️ Esta encomenda já foi entregue." + "</div>"; return; } encomendaAtual = encomenda; mostrarEncomendaParaBaixa( encomenda ); } /* ========================================================= MOSTRAR ENCOMENDA ========================================================= */ function mostrarEncomendaParaBaixa( encomenda ){ document .getElementById( "baixaCodigo" ) .textContent = encomenda.codigo; document .getElementById( "baixaNome" ) .textContent = encomenda.nome; document .getElementById( "baixaApartamento" ) .textContent = encomenda.apartamento; document .getElementById( "baixaQuantidade" ) .textContent = encomenda.quantidade; document .getElementById( "baixaFornecedor" ) .textContent = encomenda.fornecedor; document .getElementById( "baixaRemetente" ) .value = encomenda.remetente || ""; document .getElementById( "encomendaEncontrada" ) .classList.remove( "hidden" ); document .getElementById( "statusBaixa" ) .innerHTML = '<div class="success-box" style="padding:10px;border-radius:8px;">' + "✅ <b>ENCOMENDA ENCONTRADA</b><br>" + "Confira os dados antes de confirmar a entrega." + "</div>"; prepararAssinatura(); } /* ========================================================= PARAR SCANNER ========================================================= */ async function pararScanner(){ if( scanner && scannerRodando ){ try{ await scanner.stop(); }catch(e){} try{ await scanner.clear(); }catch(e){} } scanner = null; scannerRodando = false; } /* ========================================================= ASSINATURA ========================================================= */ function prepararAssinatura(){ const canvas = document.getElementById( "assinatura" ); const largura = canvas.parentElement ? canvas.parentElement .clientWidth : 600; const proporcao = window.devicePixelRatio || 1; canvas.width = largura * proporcao; canvas.height = 220 * proporcao; canvas.style.width = largura + "px"; canvas.style.height = "220px"; assinaturaCtx = canvas.getContext("2d"); assinaturaCtx.scale( proporcao, proporcao ); assinaturaCtx.lineWidth = 2; assinaturaCtx.lineCap = "round"; assinaturaCtx.lineJoin = "round"; assinaturaCtx.strokeStyle = "#111"; } function obterPosicaoCanvas( evento ){ const canvas = document.getElementById( "assinatura" ); const rect = canvas.getBoundingClientRect(); let clientX; let clientY; if( evento.touches && evento.touches.length ){ clientX = evento.touches[0].clientX; clientY = evento.touches[0].clientY; }else{ clientX = evento.clientX; clientY = evento.clientY; } return { x: clientX - rect.left, y: clientY - rect.top }; } function iniciarAssinatura( evento ){ evento.preventDefault(); assinando = true; const pos = obterPosicaoCanvas( evento ); assinaturaCtx.beginPath(); assinaturaCtx.moveTo( pos.x, pos.y ); } function desenharAssinatura( evento ){ if(!assinando){ return; } evento.preventDefault(); const pos = obterPosicaoCanvas( evento ); assinaturaCtx.lineTo( pos.x, pos.y ); assinaturaCtx.stroke(); } function finalizarAssinatura( evento ){ if( evento && evento.preventDefault ){ evento.preventDefault(); } assinando = false; } const canvas = document.getElementById( "assinatura" ); canvas.addEventListener( "mousedown", iniciarAssinatura ); canvas.addEventListener( "mousemove", desenharAssinatura ); canvas.addEventListener( "mouseup", finalizarAssinatura ); canvas.addEventListener( "mouseleave", finalizarAssinatura ); canvas.addEventListener( "touchstart", iniciarAssinatura, {passive:false} ); canvas.addEventListener( "touchmove", desenharAssinatura, {passive:false} ); canvas.addEventListener( "touchend", finalizarAssinatura, {passive:false} ); /* ========================================================= LIMPAR ASSINATURA ========================================================= */ function limparAssinatura(){ const canvas = document.getElementById( "assinatura" ); assinaturaCtx.clearRect( 0, 0, canvas.width, canvas.height ); } /* ========================================================= VERIFICAR SE EXISTE ASSINATURA ========================================================= */ function possuiAssinatura(){ const canvas = document.getElementById( "assinatura" ); const ctx = canvas.getContext("2d"); const pixels = ctx.getImageData( 0, 0, canvas.width, canvas.height ).data; /* * Verifica se existe algum pixel * diferente do fundo transparente. */ for( let i=3; i<pixels.length; i+=4 ){ if( pixels[i] > 10 ){ return true; } } return false; } /* ========================================================= CONFIRMAR BAIXA ========================================================= */ function confirmarBaixa(){ if(!encomendaAtual){ alert( "Nenhuma encomenda foi localizada." ); return; } if( !possuiAssinatura() ){ alert( "Faça a assinatura antes de confirmar a baixa." ); return; } const remetente = document .getElementById( "baixaRemetente" ) .value .trim(); if(!remetente){ alert( "Informe o nome do remetente." ); return; } const lista = obterEncomendas(); const indice = lista.findIndex( function(item){ return item.id === encomendaAtual.id; } ); if(indice < 0){ alert( "Não foi possível localizar o cadastro." ); return; } /* * Salva a assinatura como imagem. */ const assinatura = document .getElementById( "assinatura" ) .toDataURL( "image/png" ); /* * Atualiza a encomenda. */ lista[indice].status = "ENTREGUE"; lista[indice].dataBaixa = new Date().toISOString(); lista[indice].remetente = remetente; lista[indice].assinatura = assinatura; salvarEncomendas( lista ); alert( "✅ BAIXA REALIZADA COM SUCESSO!" ); encomendaAtual = null; document .getElementById( "encomendaEncontrada" ) .classList.add( "hidden" ); document .getElementById( "statusBaixa" ) .innerHTML = '<div class="success-box" style="padding:10px;border-radius:8px;">' + "✅ A encomenda foi marcada como <b>ENTREGUE</b>." + "</div>"; limparAssinatura(); atualizarContador(); } /* ========================================================= CONTADOR ========================================================= */ function atualizarContador(){ const lista = obterEncomendas(); const pendentes = lista.filter( function(item){ return item.status === "PENDENTE"; } ).length; const entregues = lista.filter( function(item){ return item.status === "ENTREGUE"; } ).length; document .getElementById( "contador" ) .textContent = "📦 Pendentes: " + pendentes + " • ✅ Entregues: " + entregues; } /* ========================================================= SEGURANÇA ========================================================= */ function escaparHTML( texto ){ return String(texto) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } /* ========================================================= INICIALIZAÇÃO ========================================================= */ atualizarContador(); </script> </body> </html>
